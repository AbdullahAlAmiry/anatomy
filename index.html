const A=document.getElementById('app'),S=document.getElementById('score');let c=0,t=0;
const upd=()=>S.textContent=`النتيجة: ${c} / ${t} سؤالاً مجاباً`;upd();

function sec(title,note){
    const h=document.createElement('h2');
    h.textContent=title;
    A.append(h);
    if(note){
        const n=document.createElement('div');
        n.className='note';
        n.innerHTML=note;
        A.append(n);
    }
}

function fin(q,ok,msg,d,correctOptName){
    q.classList.add('done');
    q.querySelector('.fb').innerHTML=(ok?'✅ إجابة صحيحة.<br>':'❌ إجابة خاطئة.<br>')+`الإجابة الصحيحة: <b>${correctOptName}</b><br>`+d;
    q.querySelectorAll('input').forEach(x=>x.disabled=true);
    t++;if(ok)c++;upd();
}

function choice(data,start,id){
    data.forEach((d,i)=>{
        const q=document.createElement('div');
        q.className='q';
        q.innerHTML=`<div class="en">${start+i}. ${d[0]}</div>
                     <div class="ar">${d[1]}</div>`+
                     d[2].map((o,j)=>`<label class="o"><input type="radio" name="${id}${i}" value="${j}"> <span class="opt-en">${'ABCD'[j]}. ${o[0]}</span> <div class="opt-ar">(${o[1]})</div></label>`).join('')+
                     '<div class="fb"></div>';
        
        q.onchange=e=>{
            if(q.classList.contains('done'))return;
            const v=+e.target.value,L=q.querySelectorAll('label.o');
            L[d[3]].classList.add('ok');
            if(v!==d[3])L[v].classList.add('no');
            const correctText = `${d[2][d[3]][0]} (${d[2][d[3]][1]})`;
            fin(q,v===d[3],'',d[4],correctText);
        };
        A.append(q);
    });
}

function tf(data,start){
    data.forEach((d,i)=>{
        const q=document.createElement('div');
        q.className='q';
        q.innerHTML=`<div class="en">${start+i}. ${d[0]}</div>
                     <div class="ar">${d[1]}</div>
                     <div class="tf">
                        <label class="o"><input type="checkbox" value="1"> ✓ True / صح</label>
                        <label class="o"><input type="checkbox" value="0"> ✗ False / خطأ</label>
                     </div>
                     <div class="fb"></div>`;
        
        q.onchange=e=>{
            if(q.classList.contains('done'))return;
            const v=+e.target.value,L=q.querySelectorAll('label.o'),ix=v?0:1;
            L.forEach((l,k)=>{if(k!==ix)l.querySelector('input').checked=false});
            L[d[2]?0:1].classList.add('ok');
            if(v!==d[2])L[ix].classList.add('no');
            const correctText = d[2] ? 'صح (True)' : 'خطأ (False)';
            fin(q,v===d[2],'',d[3],correctText);
        };
        A.append(q);
    });
}

sec('Part 1 · Multiple Choice Questions (MCQs)','<b>أسئلة الاختيار من متعدد:</b> اختر الإجابة الصحيحة، ستظهر الإجابة باللون الأخضر وتصحيحها فوراً.');
choice(MCQ,1,'m');

sec('Part 2 · True / False','<b>أسئلة الصح والخطأ:</b> ضع علامة في المربع: ✓ True للعبارة الصحيحة أو ✗ False للعبارة الخاطئة.');
tf(TF,1);
